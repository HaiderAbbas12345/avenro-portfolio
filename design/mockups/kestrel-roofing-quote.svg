<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Kestrel Roofing quote page concept</title>

  <!-- Canvas -->
  <rect width="1600" height="1000" fill="#fafaf8"/>

  <!-- Nav -->
  <rect width="1600" height="88" fill="#ffffff"/>
  <line x1="0" y1="88.5" x2="1600" y2="88.5" stroke="#e4e4de"/>
  <path d="M122 48 L135 36 L148 48" fill="none" stroke="#1f5160" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M127 54 L135 47 L143 54" fill="none" stroke="#1f5160" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <text x="160" y="50" font-size="18" font-weight="650" fill="#111213" letter-spacing="-0.2">Kestrel Roofing</text>
  <g font-size="15" fill="#4f535a">
    <text x="1020" y="50">Services</text>
    <text x="1108" y="50">Projects</text>
    <text x="1196" y="50">About</text>
    <text x="1268" y="50">Contact</text>
  </g>
  <rect x="1360" y="24" width="120" height="40" rx="8" fill="#1f5160"/>
  <text x="1420" y="49" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Get a Quote</text>

  <!-- Left column -->
  <text x="120" y="150" font-size="13" fill="#686c73">Home</text>
  <path d="M162 141 l4 4 -4 4" fill="none" stroke="#686c73" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="176" y="150" font-size="13" fill="#4f535a" font-weight="500">Free quote</text>

  <rect x="120" y="186" width="184" height="28" rx="14" fill="#1f5160" fill-opacity="0.08"/>
  <circle cx="136" cy="200" r="3.5" fill="#1f5160"/>
  <text x="148" y="205" font-size="13" font-weight="600" fill="#1f5160">No-obligation estimate</text>
  <text x="118" y="282" font-size="52" font-weight="650" fill="#111213" letter-spacing="-1.4">Get a free quote</text>
  <rect x="120" y="312" width="440" height="10" rx="5" fill="#e4e4de"/>
  <rect x="120" y="334" width="352" height="10" rx="5" fill="#e4e4de"/>

  <g>
    <rect x="120" y="396" width="48" height="48" rx="10" fill="#1f5160" fill-opacity="0.08"/>
    <path d="M136 409 h11 l5 5 v17 h-16 Z M147 409 v5 h5 M140 421 h8 M140 426 h6" fill="none" stroke="#1f5160" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="188" y="416" font-size="18" font-weight="600" fill="#111213">Written estimates</text>
    <rect x="188" y="430" width="300" height="8" rx="4" fill="#e4e4de"/>

    <rect x="120" y="484" width="48" height="48" rx="10" fill="#1f5160" fill-opacity="0.08"/>
    <path d="M144 496 l10 4 v7 c0 7 -4.5 11 -10 13 c-5.5 -2 -10 -6 -10 -13 v-7 Z" fill="none" stroke="#1f5160" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M139.5 508 l3 3 l5.5 -6" fill="none" stroke="#1f5160" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="188" y="504" font-size="18" font-weight="600" fill="#111213">Licensed &amp; insured</text>
    <rect x="188" y="518" width="268" height="8" rx="4" fill="#e4e4de"/>

    <rect x="120" y="572" width="48" height="48" rx="10" fill="#1f5160" fill-opacity="0.08"/>
    <circle cx="144" cy="596" r="10" fill="none" stroke="#1f5160" stroke-width="1.8"/>
    <path d="M144 590 v6 l4 3" fill="none" stroke="#1f5160" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="188" y="592" font-size="18" font-weight="600" fill="#111213">Reply within one business day</text>
    <rect x="188" y="606" width="312" height="8" rx="4" fill="#e4e4de"/>
  </g>

  <line x1="120" y1="676" x2="660" y2="676" stroke="#e4e4de"/>
  <text x="120" y="716" font-size="14" fill="#686c73">Prefer to talk it through?</text>
  <path d="M121 735 c0 8.5 6.5 15 15 15 l3 -3.5 -4 -3 -2.5 2 c-2.5 -1.2 -4.2 -3 -5.4 -5.4 l2 -2.5 -3 -4 Z" fill="none" stroke="#111213" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="150" y="750" font-size="20" font-weight="650" fill="#111213" letter-spacing="-0.2">Call (555) 014-2290</text>
  <text x="120" y="780" font-size="13" fill="#686c73">Mon–Fri 7am–6pm · Sat 8am–2pm</text>

  <!-- Form card -->
  <rect x="820.5" y="128.5" width="659" height="752" rx="16" fill="#ffffff" stroke="#e4e4de"/>
  <text x="868" y="188" font-size="22" font-weight="650" fill="#111213" letter-spacing="-0.3">Tell us about the job</text>
  <text x="868" y="214" font-size="14" fill="#686c73">Takes about two minutes.</text>

  <g font-size="13" font-weight="600" fill="#111213">
    <text x="868" y="262">Name</text>
    <text x="868" y="354">Phone</text>
    <text x="1224" y="354">ZIP code</text>
    <text x="868" y="446">Type of work</text>
    <text x="868" y="538">Photos</text>
  </g>
  <text x="918" y="538" font-size="13" fill="#686c73">(optional)</text>

  <!-- Name (focused) -->
  <rect x="868.5" y="274.5" width="563" height="47" rx="8" fill="#ffffff" stroke="#1f5160" stroke-width="1.5"/>
  <rect x="865" y="271" width="570" height="54" rx="11" fill="none" stroke="#1f5160" stroke-opacity="0.12" stroke-width="3"/>
  <text x="886" y="303" font-size="15" fill="#111213">Jordan Ellis</text>
  <line x1="965" y1="288" x2="965" y2="308" stroke="#1f5160" stroke-width="1.5"/>

  <!-- Phone / ZIP -->
  <rect x="868.5" y="366.5" width="339" height="47" rx="8" fill="#ffffff" stroke="#d6d6cf"/>
  <text x="886" y="395" font-size="15" fill="#686c73">(555) 000-0000</text>
  <rect x="1224.5" y="366.5" width="207" height="47" rx="8" fill="#ffffff" stroke="#d6d6cf"/>
  <text x="1242" y="395" font-size="15" fill="#686c73">e.g. 90210</text>

  <!-- Select -->
  <rect x="868.5" y="458.5" width="563" height="47" rx="8" fill="#ffffff" stroke="#d6d6cf"/>
  <text x="886" y="487" font-size="15" fill="#111213">Roof repair</text>
  <path d="M1404 479 l6 6 6 -6" fill="none" stroke="#4f535a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dropzone -->
  <rect x="868.5" y="550.5" width="563" height="139" rx="10" fill="#fafaf8" stroke="#c9ccd1" stroke-dasharray="6 5"/>
  <circle cx="1150" cy="594" r="20" fill="#1f5160" fill-opacity="0.08"/>
  <path d="M1150 602 v-15 M1144 592 l6 -6 6 6 M1141 604 h18" fill="none" stroke="#1f5160" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1150" y="642" font-size="14" text-anchor="middle"><tspan fill="#1f5160" font-weight="600">Upload photos</tspan><tspan fill="#4f535a"> or drag them here</tspan></text>
  <text x="1150" y="664" font-size="12.5" fill="#686c73" text-anchor="middle">JPG or PNG, up to 10 MB each</text>

  <!-- Submit -->
  <rect x="868" y="722" width="564" height="54" rx="10" fill="#1f5160"/>
  <text x="1150" y="755" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Request my quote</text>
  <path d="M1017 822 a3.5 3.5 0 0 1 7 0 V824.5 M1014.5 824.5 h12 v7.5 h-12 Z" fill="none" stroke="#686c73" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="1034" y="832" font-size="13" fill="#686c73">Your details are only used to prepare your estimate.</text>

  <!-- Footer -->
  <line x1="120" y1="928.5" x2="1480" y2="928.5" stroke="#e4e4de"/>
  <rect x="120" y="958" width="160" height="8" rx="4" fill="#e4e4de"/>
  <g font-size="13" fill="#686c73">
    <text x="1356" y="967" text-anchor="end">Privacy</text>
    <text x="1480" y="967" text-anchor="end">Service areas</text>
  </g>
</svg>
